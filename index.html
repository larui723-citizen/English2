<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>26s Vocabulary Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(22, 28, 45, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --accent-glow: rgba(99, 102, 241, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body { 
      background-color: var(--bg); 
      color: var(--text-main); 
      min-height: 100vh; 
      display: flex; 
      flex-direction: column; 
      padding-bottom: 80px;
      background-image: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.12) 0%, transparent 70%);
    }

    /* App Bar */
    header {
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11, 15, 25, 0.8);
    }

    .brand {
      font-weight: 800;
      font-size: 1.3rem;
      letter-spacing: -0.5px;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .container {
      padding: 20px;
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
    }

    .screen { display: none; }
    .screen.active { display: block; animation: fadeIn 0.3s ease; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Cards */
    .glass-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 16px;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .card-title {
      font-size: 0.9rem;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    /* Buttons */
    .btn {
      background: var(--primary-gradient);
      color: white;
      border: none;
      padding: 16px 20px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 700;
      width: 100%;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
    .btn:active { transform: scale(0.98); opacity: 0.9; }
    
    .btn-success { background: var(--success); box-shadow: 0 4px 20px rgba(16, 185, 129, 0.3); }
    .btn-warning { background: var(--warning); box-shadow: 0 4px 20px rgba(245, 158, 11, 0.3); }
    .btn-danger { background: var(--danger); box-shadow: 0 4px 20px rgba(239, 68, 68, 0.3); }

    /* Inputs */
    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: white;
      font-size: 1rem;
      margin: 8px 0 16px 0;
      outline: none;
      transition: border 0.2s;
    }
    input:focus { border-color: var(--primary); }

    /* Flashcard View */
    .flashcard {
      min-height: 240px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      cursor: pointer;
      border: 1px solid rgba(99, 102, 241, 0.3);
      background: radial-gradient(circle at center, rgba(99, 102, 241, 0.1) 0%, var(--card-bg) 100%);
    }

    .word-large {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 8px;
    }

    .meaning-large {
      font-size: 1.25rem;
      color: var(--primary);
      font-weight: 600;
    }

    .tap-hint {
      position: absolute;
      bottom: 12px;
      font-size: 0.75rem;
      color: var(--text-sub);
    }

    /* Navigation */
    nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: rgba(11, 15, 25, 0.9);
      backdrop-filter: blur(12px);
      display: flex;
      border-top: 1px solid var(--card-border);
      height: 65px;
      z-index: 100;
    }
    nav button {
      flex: 1;
      border: none;
      background: none;
      color: var(--text-sub);
      font-size: 0.8rem;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    nav button.active { color: #a855f7; }

    /* Progress Bar */
    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      margin-bottom: 16px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--primary-gradient);
      width: 0%;
      transition: width 0.3s ease;
    }

    .ranking-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      margin-bottom: 8px;
      border: 1px solid var(--card-border);
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<header>
  <div class="brand">26s Vocab</div>
  <div id="header-status" style="font-size: 0.85rem; color: var(--text-sub);">Ready</div>
</header>

<div class="container">

  <!-- HOME SCREEN -->
  <div id="screen-home" class="screen active">
    <div class="glass-card">
      <div class="card-title">Daily Session</div>
      <label style="font-size:0.85rem; color: var(--text-sub);">1日あたりの学習単語数</label>
      <input type="number" id="daily-limit" value="10" min="1" max="50">
      <button class="btn" onclick="startDailySession()">🚀 セッションを開始</button>
    </div>

    <div class="glass-card">
      <div class="card-title">Add New Word</div>
      <input type="text" id="new-word" placeholder="英単語 (例: resilient)">
      <input type="text" id="new-meaning" placeholder="意味 (例: 立ち直りが早い)">
      <button class="btn btn-success" onclick="addWord()">＋ 単語を追加</button>
    </div>
  </div>

  <!-- 1. INPUT ZONE -->
  <div id="screen-input" class="screen">
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="input-progress-bar"></div></div>
    <div class="glass-card" style="text-align: center; min-height: 200px; display: flex; flex-direction: column; justify-content: center;">
      <div class="card-title" id="input-step">Step 1: Input</div>
      <div class="word-large" id="input-word">---</div>
      <div class="meaning-large" id="input-meaning">---</div>
    </div>
    <button class="btn" onclick="nextInputWord()">次へ進む →</button>
  </div>

  <!-- 2. SHUFFLE CARD ZONE -->
  <div id="screen-card" class="screen">
    <div style="display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-sub); margin-bottom: 8px;">
      <span>Step 2: Shuffle Practice</span>
      <span id="card-remaining">残り: 0</span>
    </div>

    <div class="glass-card flashcard" onclick="toggleCardMeaning()">
      <div class="word-large" id="card-word">---</div>
      <div class="meaning-large hidden" id="card-meaning">---</div>
      <div class="tap-hint" id="card-hint">タップして意味を表示</div>
    </div>

    <div id="card-controls" class="hidden">
      <div style="display: flex; gap: 8px;">
        <button class="btn btn-danger" onclick="answerCard(0)">覚えてない</button>
        <button class="btn btn-warning" onclick="answerCard(1)">微妙</button>
        <button class="btn btn-success" onclick="answerCard(2)">覚えた！</button>
      </div>
    </div>
  </div>

  <!-- 3. TEST ZONE -->
  <div id="screen-test" class="screen">
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="test-progress-bar"></div></div>
    <div class="glass-card">
      <div class="card-title" id="test-step">Step 3: Final Test</div>
      <div class="word-large" id="test-word" style="text-align: center; margin: 20px 0;">---</div>
      <input type="text" id="test-input" placeholder="意味を入力してください" autocomplete="off">
      <button class="btn" onclick="checkTestAnswer()">回答する</button>
    </div>
  </div>

  <!-- STATS SCREEN -->
  <div id="screen-stats" class="screen">
    <div class="glass-card">
      <div class="card-title">🔥 苦手単語ランキング TOP 10</div>
      <div id="ranking-list"></div>
    </div>
    <div class="glass-card">
      <div class="card-title">📊 テスト履歴</div>
      <div id="history-list"></div>
    </div>
  </div>

</div>

<!-- Navigation Bar -->
<nav>
  <button onclick="switchScreen('home')" id="nav-home" class="active">
    <span>学習</span>
  </button>
  <button onclick="switchScreen('stats')" id="nav-stats">
    <span>分析</span>
  </button>
</nav>

<script>
  let words = JSON.parse(localStorage.getItem('words')) || [];
  let testHistory = JSON.parse(localStorage.getItem('testHistory')) || [];
  
  let sessionWords = [], currentInputIndex = 0, cardQueue = [];
  let currentCardWord = null, testQueue = [], currentTestIndex = 0, testScore = 0;

  function switchScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    
    document.getElementById(`screen-${screenId}`).classList.add('active');
    if(document.getElementById(`nav-${screenId}`)) document.getElementById(`nav-${screenId}`).classList.add('active');
    if(screenId === 'stats') renderStats();
  }

  function addWord() {
    const wordInput = document.getElementById('new-word');
    const meaningInput = document.getElementById('new-meaning');
    if (!wordInput.value || !meaningInput.value) return alert('入力してください');

    words.push({
      id: Date.now(),
      word: wordInput.value.trim(),
      meaning: meaningInput.value.trim(),
      nextReviewDate: new Date().toISOString().split('T')[0],
      interval: 0,
      failCount: 0
    });

    saveData();
    wordInput.value = ''; meaningInput.value = '';
    alert('追加完了しました！');
  }

  function saveData() {
    localStorage.setItem('words', JSON.stringify(words));
    localStorage.setItem('testHistory', JSON.stringify(testHistory));
  }

  function startDailySession() {
    const limit = parseInt(document.getElementById('daily-limit').value);
    const today = new Date().toISOString().split('T')[0];

    let dueWords = words.filter(w => w.nextReviewDate <= today);
    if(dueWords.length === 0) return alert('本日の復習単語はありません！');

    sessionWords = dueWords.slice(0, limit);
    currentInputIndex = 0;
    document.getElementById('header-status').innerText = '1. Input';
    switchScreen('input');
    renderInputWord();
  }

  function renderInputWord() {
    const w = sessionWords[currentInputIndex];
    const pct = ((currentInputIndex + 1) / sessionWords.length) * 100;
    document.getElementById('input-progress-bar').style.width = `${pct}%`;
    document.getElementById('input-word').innerText = w.word;
    document.getElementById('input-meaning').innerText = w.meaning;
  }

  function nextInputWord() {
    currentInputIndex++;
    if (currentInputIndex < sessionWords.length) {
      renderInputWord();
    } else {
      startCardZone();
    }
  }

  function startCardZone() {
    document.getElementById('header-status').innerText = '2. Cards';
    cardQueue = [...sessionWords];
    switchScreen('card');
    nextCard();
  }

  function nextCard() {
    if (cardQueue.length === 0) {
      startTestZone();
      return;
    }
    const randomIndex = Math.floor(Math.random() * cardQueue.length);
    currentCardWord = cardQueue[randomIndex];

    document.getElementById('card-word').innerText = currentCardWord.word;
    document.getElementById('card-meaning').innerText = currentCardWord.meaning;
    document.getElementById('card-meaning').classList.add('hidden');
    document.getElementById('card-controls').classList.add('hidden');
    document.getElementById('card-hint').classList.remove('hidden');
    document.getElementById('card-remaining').innerText = `残り: ${cardQueue.length}`;
  }

  function toggleCardMeaning() {
    document.getElementById('card-meaning').classList.remove('hidden');
    document.getElementById('card-controls').classList.remove('hidden');
    document.getElementById('card-hint').classList.add('hidden');
  }

  function answerCard(type) {
    const wordObj = words.find(w => w.id === currentCardWord.id);
    if (type === 2) {
      cardQueue = cardQueue.filter(w => w.id !== currentCardWord.id);
      updateInterval(wordObj, true);
    } else {
      wordObj.failCount++;
      updateInterval(wordObj, false);
    }
    saveData();
    nextCard();
  }

  function startTestZone() {
    document.getElementById('header-status').innerText = '3. Test';
    testQueue = [...sessionWords];
    currentTestIndex = 0; testScore = 0;
    switchScreen('test');
    renderTestQuestion();
  }

  function renderTestQuestion() {
    const w = testQueue[currentTestIndex];
    const pct = ((currentTestIndex + 1) / testQueue.length) * 100;
    document.getElementById('test-progress-bar').style.width = `${pct}%`;
    document.getElementById('test-word').innerText = w.word;
    document.getElementById('test-input').value = '';
  }

  function checkTestAnswer() {
    const input = document.getElementById('test-input').value.trim();
    const w = testQueue[currentTestIndex];
    const targetObj = words.find(item => item.id === w.id);

    if (input && w.meaning.includes(input)) {
      testScore++;
    } else {
      targetObj.failCount++;
      alert(`❌ 不正解！ 正解: ${w.meaning}`);
    }

    currentTestIndex++;
    if (currentTestIndex < testQueue.length) {
      renderTestQuestion();
    } else {
      testHistory.unshift({ date: new Date().toLocaleDateString(), score: testScore, total: testQueue.length });
      saveData();
      alert(`🎉 セッション完了！ スコア: ${testScore} / ${testQueue.length}`);
      switchScreen('home');
      document.getElementById('header-status').innerText = 'Ready';
    }
  }

  function updateInterval(wordObj, isSuccess) {
    const intervals = [1, 3, 7, 14, 30];
    if (isSuccess) {
      const nextDays = intervals[wordObj.interval] || 30;
      wordObj.interval = Math.min(wordObj.interval + 1, intervals.length - 1);
      let targetDate = new Date();
      targetDate.setDate(targetDate.getDate() + nextDays);
      wordObj.nextReviewDate = targetDate.toISOString().split('T')[0];
    } else {
      wordObj.interval = 0;
      let tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      wordObj.nextReviewDate = tomorrow.toISOString().split('T')[0];
    }
  }

  function renderStats() {
    const sorted = [...words].sort((a, b) => b.failCount - a.failCount).slice(0, 10);
    const rankingEl = document.getElementById('ranking-list');
    rankingEl.innerHTML = sorted.length === 0 ? '<p style="color:var(--text-sub);">データがありません</p>' : '';
    
    sorted.forEach((w, i) => {
      rankingEl.innerHTML += `
        <div class="ranking-item">
          <div>
            <div style="font-weight:700;">${i + 1}. ${w.word}</div>
            <div style="font-size:0.8rem; color:var(--text-sub);">${w.meaning}</div>
          </div>
          <div style="color:var(--danger); font-weight:800;">${w.failCount} ミス</div>
        </div>
      `;
    });

    const historyEl = document.getElementById('history-list');
    historyEl.innerHTML = testHistory.length === 0 ? '<p style="color:var(--text-sub);">履歴がありません</p>' : '';
    testHistory.slice(0, 5).forEach(h => {
      historyEl.innerHTML += `
        <div class="ranking-item">
          <span>${h.date}</span>
          <span style="font-weight:700; color:var(--primary);">${h.score} / ${h.total}</span>
        </div>
      `;
    });
  }
</script>
</body>
</html>
