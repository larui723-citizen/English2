<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>26s Vocabulary Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --surface: #121826;
      --surface-border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-glow: rgba(99, 102, 241, 0.25);
      --accent: #06b6d4;
      --gradient-main: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
      --text: #f8fafc;
      --text-muted: #64748b;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body { 
      background-color: var(--bg); 
      color: var(--text); 
      min-height: 100vh; 
      display: flex; 
      flex-direction: column; 
      padding-bottom: 90px;
      background-image: 
        radial-gradient(ellipse at 10% 0%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 90% 80%, rgba(6, 182, 212, 0.1) 0%, transparent 50%);
    }

    /* Header */
    header {
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--surface-border);
      position: sticky;
      top: 0;
      z-index: 90;
    }

    .brand-logo {
      font-weight: 800;
      font-size: 1.25rem;
      letter-spacing: -0.5px;
      background: var(--gradient-main);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .container {
      padding: 16px;
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
    }

    .screen { display: none; }
    .screen.active { display: block; animation: pageFade 0.25s ease-out; }

    @keyframes pageFade {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Cards & Components */
    .glass-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .stat-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--surface-border);
      border-radius: 16px;
      padding: 14px 10px;
      text-align: center;
    }

    .stat-value {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text);
    }

    .stat-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 4px;
      font-weight: 600;
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    /* Buttons */
    .btn {
      background: var(--gradient-main);
      color: white;
      border: none;
      padding: 16px 20px;
      border-radius: 16px;
      font-size: 0.95rem;
      font-weight: 700;
      width: 100%;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px var(--primary-glow);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
    .btn:active { transform: scale(0.98); opacity: 0.9; }
    
    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--surface-border);
      color: var(--text);
      box-shadow: none;
    }

    .btn-success { background: var(--success); box-shadow: 0 4px 16px rgba(16, 185, 129, 0.3); }
    .btn-warning { background: var(--warning); box-shadow: 0 4px 16px rgba(245, 158, 11, 0.3); }
    .btn-danger { background: var(--danger); box-shadow: 0 4px 16px rgba(239, 68, 68, 0.3); }

    /* Inputs */
    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 14px 16px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--surface-border);
      border-radius: 12px;
      color: white;
      font-size: 1rem;
      margin: 8px 0 16px 0;
      outline: none;
    }
    input:focus { border-color: var(--primary); }

    /* Card Flashcard */
    .flashcard {
      min-height: 260px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      cursor: pointer;
      border: 1px solid rgba(99, 102, 241, 0.3);
      background: radial-gradient(circle at center, rgba(99, 102, 241, 0.12) 0%, var(--surface) 100%);
    }

    .word-main {
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .meaning-main {
      font-size: 1.25rem;
      color: var(--accent);
      font-weight: 600;
    }

    .tap-hint {
      position: absolute;
      bottom: 16px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Progress Bar */
    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      margin-bottom: 16px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--gradient-main);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Item Cards */
    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 14px;
      margin-bottom: 8px;
      border: 1px solid var(--surface-border);
    }

    /* Bottom Nav Bar */
    nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: rgba(18, 24, 38, 0.95);
      backdrop-filter: blur(16px);
      display: flex;
      border-top: 1px solid var(--surface-border);
      height: 70px;
      z-index: 100;
    }

    nav button {
      flex: 1;
      border: none;
      background: none;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
    }

    nav button.active {
      color: #a855f7;
    }

    nav button svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<header>
  <div class="brand-logo">26s VOCAB</div>
  <div id="header-status" style="font-size: 0.8rem; font-weight: 700; color: var(--accent);">DASHBOARD</div>
</header>

<div class="container">

  <!-- 1. HOME DASHBOARD -->
  <div id="screen-home" class="screen active">
    
    <!-- Stats Overview -->
    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-value" id="stat-total">0</div>
        <div class="stat-label">総単語数</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" style="color: var(--accent);" id="stat-due">0</div>
        <div class="stat-label">今日の復習</div>
      </div>
      <div class="stat-box">
        <div class="stat-value" style="color: var(--success);" id="stat-mastered">0</div>
        <div class="stat-label">定着済み</div>
      </div>
    </div>

    <!-- Quick Start Card -->
    <div class="glass-card">
      <div class="section-title">Today's Session</div>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 12px;">忘却曲線に基づいた本日の最適な復習セッション</p>
      
      <label style="font-size:0.75rem; color: var(--text-muted); font-weight:600;">1日の目標単語数</label>
      <input type="number" id="daily-limit" value="10" min="1" max="50">
      
      <button class="btn" onclick="startDailySession()">⚡ 今日の学習をスタート</button>
    </div>

    <!-- Actions -->
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
      <button class="btn btn-secondary" onclick="switchScreen('add')">＋ 単語追加</button>
      <button class="btn btn-secondary" onclick="switchScreen('library')">📚 ライブラリ</button>
    </div>
  </div>

  <!-- 2. ADD WORD SCREEN -->
  <div id="screen-add" class="screen">
    <div class="glass-card">
      <div class="section-title">Add New Word</div>
      <input type="text" id="new-word" placeholder="英単語 (例: persistent)">
      <input type="text" id="new-meaning" placeholder="意味 (例: 粘り強い)">
      <button class="btn btn-success" onclick="addWord()">登録する</button>
    </div>
  </div>

  <!-- 3. LIBRARY SCREEN -->
  <div id="screen-library" class="screen">
    <div class="glass-card">
      <div class="section-title">Word Library</div>
      <div id="library-list"></div>
    </div>
  </div>

  <!-- 4. STATS SCREEN -->
  <div id="screen-stats" class="screen">
    <div class="glass-card">
      <div class="section-title">🔥 苦手単語ワースト10</div>
      <div id="ranking-list"></div>
    </div>
    <div class="glass-card">
      <div class="section-title">📊 テスト結果履歴</div>
      <div id="history-list"></div>
    </div>
  </div>

  <!-- LEARNING FLOW SCREENS -->

  <!-- STEP 1: INPUT -->
  <div id="screen-input" class="screen">
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="input-progress-bar"></div></div>
    <div class="glass-card" style="text-align: center; min-height: 220px; display: flex; flex-direction: column; justify-content: center;">
      <div class="section-title">Step 1: Input</div>
      <div class="word-main" id="input-word">---</div>
      <div class="meaning-main" id="input-meaning">---</div>
    </div>
    <button class="btn" onclick="nextInputWord()">次へ進む →</button>
  </div>

  <!-- STEP 2: SHUFFLE CARD -->
  <div id="screen-card" class="screen">
    <div style="display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 8px;">
      <span>Step 2: Shuffle Practice</span>
      <span id="card-remaining">残り: 0</span>
    </div>

    <div class="glass-card flashcard" onclick="toggleCardMeaning()">
      <div class="word-main" id="card-word">---</div>
      <div class="meaning-main hidden" id="card-meaning">---</div>
      <div class="tap-hint" id="card-hint">カードをタップして確認</div>
    </div>

    <div id="card-controls" class="hidden">
      <div style="display: flex; gap: 8px;">
        <button class="btn btn-danger" onclick="answerCard(0)">覚えてない</button>
        <button class="btn btn-warning" onclick="answerCard(1)">微妙</button>
        <button class="btn btn-success" onclick="answerCard(2)">覚えた！</button>
      </div>
    </div>
  </div>

  <!-- STEP 3: TEST -->
  <div id="screen-test" class="screen">
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="test-progress-bar"></div></div>
    <div class="glass-card">
      <div class="section-title">Step 3: Final Test</div>
      <div class="word-main" id="test-word" style="text-align: center; margin: 24px 0;">---</div>
      <input type="text" id="test-input" placeholder="意味を入力" autocomplete="off">
      <button class="btn" onclick="checkTestAnswer()">回答する</button>
    </div>
  </div>

</div>

<!-- Bottom Navigation Bar -->
<nav>
  <button onclick="switchScreen('home')" id="nav-home" class="active">
    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
    <span>ホーム</span>
  </button>
  <button onclick="switchScreen('library')" id="nav-library">
    <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
    <span>単語一覧</span>
  </button>

  <button onclick="switchScreen('add')" id="nav-add">
    <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
    <span>追加</span>
  </button>

  <button onclick="switchScreen('stats')" id="nav-stats">
    <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
    <span>分析</span>
  </button>
</nav>

<script>
  let words = JSON.parse(localStorage.getItem('words')) || [];
  let testHistory = JSON.parse(localStorage.getItem('testHistory')) || [];
  
  let sessionWords = [], currentInputIndex = 0, cardQueue = [];
  let currentCardWord = null, testQueue = [], currentTestIndex = 0, testScore = 0;

  function updateDashboardStats() {
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('stat-total').innerText = words.length;
    document.getElementById('stat-due').innerText = words.filter(w => w.nextReviewDate <= today).length;
    document.getElementById('stat-mastered').innerText = words.filter(w => w.interval >= 4).length;
  }

  function switchScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    
    document.getElementById(`screen-${screenId}`).classList.add('active');
    
    const navBtn = document.getElementById(`nav-${screenId}`);
    if (navBtn) navBtn.classList.add('active');

    const statusMap = {
      home: 'DASHBOARD', add: 'ADD WORD', library: 'LIBRARY', stats: 'ANALYTICS',
      input: 'STEP 1/3', card: 'STEP 2/3', test: 'STEP 3/3'
    };
    document.getElementById('header-status').innerText = statusMap[screenId] || '26s VOCAB';

    if (screenId === 'home') updateDashboardStats();
    if (screenId === 'stats') renderStats();
    if (screenId === 'library') renderLibrary();
  }

  function addWord() {
    const wordInput = document.getElementById('new-word');
    const meaningInput = document.getElementById('new-meaning');
    if (!wordInput.value || !meaningInput.value) return alert('入力してください');

    words.push({
      id: Date.now(),
      word: wordInput.value.trim(),
      meaning: meaningInput.value.trim(),
      nextReviewDate: new Date().toISOString().split('T')[0],
      interval: 0,
      failCount: 0
    });

    saveData();
    wordInput.value = ''; meaningInput.value = '';
    alert('登録完了しました！');
    switchScreen('home');
  }

  function deleteWord(id) {
    if(!confirm('この単語を削除しますか？')) return;
    words = words.filter(w => w.id !== id);
    saveData();
    renderLibrary();
    updateDashboardStats();
  }

  function saveData() {
    localStorage.setItem('words', JSON.stringify(words));
    localStorage.setItem('testHistory', JSON.stringify(testHistory));
  }

  function startDailySession() {
    const limit = parseInt(document.getElementById('daily-limit').value);
    const today = new Date().toISOString().split('T')[0];

    let dueWords = words.filter(w => w.nextReviewDate <= today);
    if(dueWords.length === 0) return alert('本日の復習対象はありません！');

    sessionWords = dueWords.slice(0, limit);
    currentInputIndex = 0;
    switchScreen('input');
    renderInputWord();
  }

  function renderInputWord() {
    const w = sessionWords[currentInputIndex];
    const pct = ((currentInputIndex + 1) / sessionWords.length) * 100;
    document.getElementById('input-progress-bar').style.width = `${pct}%`;
    document.getElementById('input-word').innerText = w.word;
    document.getElementById('input-meaning').innerText = w.meaning;
  }

  function nextInputWord() {
    currentInputIndex++;
    if (currentInputIndex < sessionWords.length) {
      renderInputWord();
    } else {
      startCardZone();
    }
  }

  function startCardZone() {
    cardQueue = [...sessionWords];
    switchScreen('card');
    nextCard();
  }

  function nextCard() {
    if (cardQueue.length === 0) {
      startTestZone();
      return;
    }
    const randomIndex = Math.floor(Math.random() * cardQueue.length);
    currentCardWord = cardQueue[randomIndex];

    document.getElementById('card-word').innerText = currentCardWord.word;
    document.getElementById('card-meaning').innerText = currentCardWord.meaning;
    document.getElementById('card-meaning').classList.add('hidden');
    document.getElementById('card-controls').classList.add('hidden');
    document.getElementById('card-hint').classList.remove('hidden');
    document.getElementById('card-remaining').innerText = `残り: ${cardQueue.length}`;
  }

  function toggleCardMeaning() {
    document.getElementById('card-meaning').classList.remove('hidden');
    document.getElementById('card-controls').classList.remove('hidden');
    document.getElementById('card-hint').classList.add('hidden');
  }

  function answerCard(type) {
    const wordObj = words.find(w => w.id === currentCardWord.id);
    if (type === 2) {
      cardQueue = cardQueue.filter(w => w.id !== currentCardWord.id);
      updateInterval(wordObj, true);
    } else {
      wordObj.failCount++;
      updateInterval(wordObj, false);
    }
    saveData();
    nextCard();
  }

  function startTestZone() {
    testQueue = [...sessionWords];
    currentTestIndex = 0; testScore = 0;
    switchScreen('test');
    renderTestQuestion();
  }

  function renderTestQuestion() {
    const w = testQueue[currentTestIndex];
    const pct = ((currentTestIndex + 1) / testQueue.length) * 100;
    document.getElementById('test-progress-bar').style.width = `${pct}%`;
    document.getElementById('test-word').innerText = w.word;
    document.getElementById('test-input').value = '';
  }

  function checkTestAnswer() {
    const input = document.getElementById('test-input').value.trim();
    const w = testQueue[currentTestIndex];
    const targetObj = words.find(item => item.id === w.id);

    if (input && w.meaning.includes(input)) {
      testScore++;
    } else {
      targetObj.failCount++;
      alert(`❌ 不正解！ 正解: ${w.meaning}`);
    }

    currentTestIndex++;
    if (currentTestIndex < testQueue.length) {
      renderTestQuestion();
    } else {
      testHistory.unshift({ date: new Date().toLocaleDateString(), score: testScore, total: testQueue.length });
      saveData();
      alert(`🎉 セッション完了！ スコア: ${testScore} / ${testQueue.length}`);
      switchScreen('home');
    }
  }

  function updateInterval(wordObj, isSuccess) {
    const intervals = [1, 3, 7, 14, 30];
    if (isSuccess) {
      const nextDays = intervals[wordObj.interval] || 30;
      wordObj.interval = Math.min(wordObj.interval + 1, intervals.length - 1);
      let targetDate = new Date();
      targetDate.setDate(targetDate.getDate() + nextDays);
      wordObj.nextReviewDate = targetDate.toISOString().split('T')[0];
    } else {
      wordObj.interval = 0;
      let tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      wordObj.nextReviewDate = tomorrow.toISOString().split('T')[0];
    }
  }

  function renderLibrary() {
    const container = document.getElementById('library-list');
    container.innerHTML = words.length === 0 ? '<p style="color:var(--text-muted);">単語が登録されていません</p>' : '';
    words.forEach(w => {
      container.innerHTML += `
        <div class="list-item">
          <div>
            <div style="font-weight:700;">${w.word}</div>
            <div style="font-size:0.8rem; color:var(--text-muted);">${w.meaning}</div>
          </div>
          <button style="background:none; border:none; color:var(--danger); cursor:pointer; font-size:0.8rem;" onclick="deleteWord(${w.id})">削除</button>
        </div>
      `;
    });
  }

  function renderStats() {
    const sorted = [...words].sort((a, b) => b.failCount - a.failCount).slice(0, 10);
    const rankingEl = document.getElementById('ranking-list');
    rankingEl.innerHTML = sorted.length === 0 ? '<p style="color:var(--text-muted);">データがありません</p>' : '';
    
    sorted.forEach((w, i) => {
      rankingEl.innerHTML += `
        <div class="list-item">
          <div>
            <div style="font-weight:700;">${i + 1}. ${w.word}</div>
            <div style="font-size:0.8rem; color:var(--text-muted);">${w.meaning}</div>
          </div>
          <div style="color:var(--danger); font-weight:800; font-size:0.85rem;">${w.failCount} ミス</div>
        </div>
      `;
    });

    const historyEl = document.getElementById('history-list');
    historyEl.innerHTML = testHistory.length === 0 ? '<p style="color:var(--text-muted);">履歴がありません</p>' : '';
    testHistory.slice(0, 5).forEach(h => {
      historyEl.innerHTML += `
        <div class="list-item">
          <span style="font-size:0.85rem;">${h.date}</span>
          <span style="font-weight:700; color:var(--accent);">${h.score} / ${h.total}</span>
        </div>
      `;
    });
  }

  // 初期実行
  updateDashboardStats();
</script>
</body>
</html>
